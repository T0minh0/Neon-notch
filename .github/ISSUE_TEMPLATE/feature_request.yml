name: Feature request
description: Suggest a focused improvement to Neon Notch.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Do not include credentials, agent transcripts,
        clipboard contents, or other sensitive desktop information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the outcome and any interaction or privacy expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add safe mockups, examples, or references if useful.
